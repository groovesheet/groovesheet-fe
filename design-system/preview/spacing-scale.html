<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing — Scale</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .row { display: grid; grid-template-columns: 110px 80px 1fr; gap: 18px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-border-light); }
  .name { font-size: 14px; font-weight: 500; color: var(--color-text); }
  .px { font-family: var(--font-family-mono); font-size: 11px; color: var(--color-muted-foreground); }
  .bar { height: 28px; background: var(--color-primary); border-radius: 4px; }
</style>
</head>
<body class="dotted">
  <div class="card-frame">
    <p class="card-eyebrow">Spacing</p>
    <h1 class="card-title">Scale</h1>
    <p class="card-sub">Mostly multiples of 4 / 8. Two oddballs lifted from production: 28.8 (1.8rem inner card padding) and 60 (section gap).</p>

    <div class="row"><div class="name">XS</div><div class="px">4px</div><div class="bar" style="width:4px"></div></div>
    <div class="row"><div class="name">SM</div><div class="px">8px</div><div class="bar" style="width:8px"></div></div>
    <div class="row"><div class="name">MD</div><div class="px">12px</div><div class="bar" style="width:12px"></div></div>
    <div class="row"><div class="name">Base</div><div class="px">16px</div><div class="bar" style="width:16px"></div></div>
    <div class="row"><div class="name">LG</div><div class="px">24px</div><div class="bar" style="width:24px"></div></div>
    <div class="row"><div class="name">XL</div><div class="px">28.8px</div><div class="bar" style="width:28.8px"></div></div>
    <div class="row"><div class="name">2XL</div><div class="px">32px</div><div class="bar" style="width:32px"></div></div>
    <div class="row"><div class="name">3XL</div><div class="px">40px</div><div class="bar" style="width:40px"></div></div>
    <div class="row"><div class="name">4XL</div><div class="px">60px</div><div class="bar" style="width:60px"></div></div>
    <div class="row"><div class="name">5XL</div><div class="px">80px</div><div class="bar" style="width:80px"></div></div>
  </div>
</body>
</html>
