<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Components — Inputs</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .panel { background: var(--color-panel2); border-radius: 13px; padding: 28px; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--color-muted-foreground); margin: 0 0 18px; font-weight: 500; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: var(--color-text); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 12px 14px; border-radius: 6px;
    border: 1px solid var(--color-input-border);
    background: var(--color-input-bg);
    color: var(--color-text);
    font-family: var(--font-family-sans);
    font-size: 14px;
    outline: none;
  }
  .field input::placeholder { color: var(--color-input-placeholder); }
  .field input:focus { border-color: var(--color-primary); }
  .field-error input { border-color: #ff6b6b; }
  .field-error .help { color: #ff6b6b; font-size: 12px; margin-top: 6px; }
  .help { font-size: 12px; color: var(--color-muted-foreground); margin-top: 6px; }
  .light-frame { background: #fff; }
  .light-frame .field label { color: #000; }
  .light-frame .field input { background: #f6f6f6; border-color: #e5e5e5; color: #000; }
  .light-frame .field input::placeholder { color: #b0b0b0; }
  .light-frame h3 { color: #666; }
  .light-frame .help { color: #666; }
</style>
</head>
<body class="dotted">
  <div class="card-frame">
    <p class="card-eyebrow">Components</p>
    <h1 class="card-title">Inputs</h1>
    <p class="card-sub">Single-style fields used across upload metadata, account settings, and auth. Border lights to brand blue on focus; error state flips border to danger red.</p>

    <div class="grid">
      <div class="panel">
        <h3>Dark · default</h3>
        <div class="field">
          <label>Email</label>
          <input type="email" placeholder="you@band.fm" />
        </div>
        <div class="field">
          <label>Track title</label>
          <input type="text" value="Live take 04 — bridge" />
        </div>
        <div class="field field-error">
          <label>Tempo (BPM)</label>
          <input type="number" value="999" />
          <div class="help">Tempo must be between 40 and 240.</div>
        </div>
      </div>

      <div class="panel light-frame" data-theme="light">
        <h3>Light · default</h3>
        <div class="field">
          <label>Email</label>
          <input type="email" placeholder="you@band.fm" />
        </div>
        <div class="field">
          <label>Track title</label>
          <input type="text" value="Live take 04 — bridge" />
        </div>
        <div class="field">
          <label>Notes</label>
          <input type="text" placeholder="Optional context for the engineer…" />
          <div class="help">Visible to anyone with access to the project.</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
