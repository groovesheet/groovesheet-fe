name: Tests

# Deliberately cheap, for the same reason groovesheet-be filters its builds
# after the 2026-07 Actions billing incident:
#   - only runs when code or dependencies change, not on doc or asset edits
#   - one job, one Node version, no matrix
#   - npm cache keyed on the lockfile, so the usual run installs from cache
#   - concurrency cancels superseded runs on the same branch
#
# It exists because tests/i18n/claims.test.ts guards the marketing copy against
# the product it describes, and a guard nobody runs is not a guard. Every
# conversion defect found in the 2026-09-04 audit was copy that had drifted
# from a value enforced in code.
#
# The paths below moved with the Next.js migration. They used to list `src/**`
# alone, which was the whole CRA app and is now the dead tree awaiting deletion:
# left as it was, this workflow would have gone quiet on the very commit that
# gave it something to guard. `tests/seo/**` is covered by `tests/**`, and it
# holds the other claims guard: which instruments the hub pages may promise
# notation for.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'i18n/**'
      - 'messages/**'
      - 'tests/**'
      - 'next.config.ts'
      - 'proxy.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'i18n/**'
      - 'messages/**'
      - 'tests/**'
      - 'next.config.ts'
      - 'proxy.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Node version Vercel builds this project with.
          node-version: '24'
          cache: npm

      - run: npm ci

      # `npm test` is `vitest run`: one pass, no watcher, so the CRA-era
      # `-- --watchAll=false` is gone.
      - name: Run tests
        run: npm test

      # Cheap next to the test run, and it catches the class of break a test
      # cannot: a route that no longer type-checks still renders in dev.
      - name: Typecheck
        run: npm run typecheck
